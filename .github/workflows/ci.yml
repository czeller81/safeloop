name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install -r python/requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest python/tests

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Certify coding profile
        run: npm run certify -- --profile coding

      - name: Certify research profile
        run: npm run certify -- --profile research

      - name: Hermes MCP doctor
        run: npm run mcp:doctor:hermes

      - name: Live simulation
        run: npm run example:live-simulation
